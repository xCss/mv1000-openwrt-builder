name: Build MV1000 firmware

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Proxy plugin preinstalled in the image"
        type: choice
        options:
          - singbox
          - openclash
          - none
        default: singbox
      rootfs_mb:
        description: "Root filesystem size in MB (256 / 512 / 1024)"
        type: string
        default: "256"
  push:
    branches: [main]
    paths:
      - "files/**"
      - "singbox.env"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OWRT_VERSION: "25.12.6"
  TARGET_PATH: "mvebu/cortexa53"
  TARGET_NAME: "mvebu-cortexa53"
  PROFILE: "glinet_gl-mv1000"
  PLUGIN: ${{ inputs.plugin || 'singbox' }}
  ROOTFS_MB: ${{ inputs.rootfs_mb || '256' }}
  ARGON_VERSION: "3.1.2"
  ARGON_HASH: "3fdbd812dafd521926891863a372aba78ab83ec24add47bdda910fb1f6b1be40"

jobs:
  # A pushed change can land before the sing-box workflow has published the
  # pinned apk. Skip (do not fail) until singbox.env points at an existing
  # release; the sing-box workflow dispatches this one once it does.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v7

      - name: Check package availability
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ok=true
          if [ "$PLUGIN" = "singbox" ]; then
            version=$(sed -n 's/^SINGBOX_VERSION=//p' singbox.env 2>/dev/null || true)
            sha=$(sed -n 's/^SINGBOX_APK_SHA256=//p' singbox.env 2>/dev/null || true)
            if [ -z "$version" ] || [ -z "$sha" ]; then
              ok=false
              echo "::warning::singbox.env is not pinned yet; waiting for the sing-box workflow"
            elif ! gh release view "singbox-tiny-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              ok=false
              echo "::warning::release singbox-tiny-v$version is missing; waiting for the sing-box workflow"
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Load sing-box package pin
        if: env.PLUGIN == 'singbox'
        run: cat singbox.env >> "$GITHUB_ENV"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses-dev zlib1g-dev \
            libssl-dev rsync unzip file

      - name: Download and verify Image Builder
        run: |
          set -euo pipefail
          IB="openwrt-imagebuilder-${OWRT_VERSION}-${TARGET_NAME}.Linux-x86_64.tar.zst"
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${TARGET_PATH}"
          curl -fsSL -o "$IB" "$BASE/$IB"
          curl -fsSL -o sha256sums "$BASE/sha256sums"
          grep -F "$IB" sha256sums | sha256sum -c -
          tar --zstd -xf "$IB"

      - name: Prepare Image Builder
        run: |
          set -euo pipefail
          cd "openwrt-imagebuilder-${OWRT_VERSION}-${TARGET_NAME}.Linux-x86_64"
          echo "IB_DIR=$PWD" >> "$GITHUB_ENV"
          # Third-party apk packages (argon, sing-box-tiny) are not signed with
          # a key known to the build, so signature verification has to be off.
          # Official feeds are still fetched over HTTPS from
          # downloads.openwrt.org.
          sed -i 's/^CONFIG_SIGNATURE_CHECK=.*/# CONFIG_SIGNATURE_CHECK is not set/' .config
          mkdir -p packages
          chmod +x "$GITHUB_WORKSPACE"/files/etc/uci-defaults/*

      - name: Download sing-box apk
        if: env.PLUGIN == 'singbox'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/singbox"
          gh release download "singbox-tiny-v${SINGBOX_VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sing-box-tiny-*.apk' --dir "$RUNNER_TEMP/singbox" --clobber
          apk=$(ls "$RUNNER_TEMP"/singbox/sing-box-tiny-*.apk)
          echo "${SINGBOX_APK_SHA256}  $apk" | sha256sum -c -
          cp "$apk" "$IB_DIR/packages/"

      - name: Fetch theme and plugin packages
        run: |
          set -euo pipefail
          pkgs="luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-app-package-manager luci-i18n-package-manager-zh-cn curl ca-bundle parted block-mount e2fsprogs wget-ssl"

          argon="luci-theme-argon-${ARGON_VERSION}-r1.apk"
          curl -fsSL -o "$IB_DIR/packages/$argon" \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v${ARGON_VERSION}/$argon"
          echo "$ARGON_HASH  $IB_DIR/packages/$argon" | sha256sum -c -
          pkgs="$pkgs luci-theme-argon"

          case "$PLUGIN" in
            singbox)
              pkgs="$pkgs sing-box-tiny kmod-tun kmod-inet-diag"
              ;;
            openclash)
              oc_url=$(curl -fsSL https://api.github.com/repos/vernesong/OpenClash/releases/latest \
                | jq -r '[.assets[] | select(.name | endswith(".apk")) | .browser_download_url][0]')
              curl -fsSL -o "$IB_DIR/packages/$(basename "$oc_url")" "$oc_url"

              # OpenClash downloads its core on first start; seed it so the
              # router does not need GitHub access to become functional.
              core_url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
                | jq -r '[.assets[] | select(.name | test("^mihomo-linux-arm64-v.*\\.gz$")) | .browser_download_url][0]')
              mkdir -p "$GITHUB_WORKSPACE/files/etc/openclash/core"
              curl -fsSL "$core_url" | gunzip > "$GITHUB_WORKSPACE/files/etc/openclash/core/clash_meta"
              chmod +x "$GITHUB_WORKSPACE/files/etc/openclash/core/clash_meta"

              pkgs="-dnsmasq dnsmasq-full luci-compat luci-app-openclash $pkgs"
              ;;
            none) ;;
            *) echo "unknown plugin: $PLUGIN"; exit 1 ;;
          esac

          echo "PKGS=$pkgs" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PKGS" \
            FILES="$GITHUB_WORKSPACE/files" \
            ROOTFS_PARTSIZE="$ROOTFS_MB" \
            EXTRA_IMAGE_NAME="mv1000-${PLUGIN}"
          ls -lh bin/targets/"$TARGET_PATH"/

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.OWRT_VERSION }}-mv1000-${{ env.PLUGIN }}
          path: |
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/*ext4-sdcard.img.gz
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/sha256sums
          if-no-files-found: error

      - name: Publish release assets on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/*ext4-sdcard.img.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
