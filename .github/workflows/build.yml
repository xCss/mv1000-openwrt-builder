name: Build MV1000 firmware

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Proxy plugin preinstalled in the image"
        type: choice
        options:
          - singbox
          - openclash
          - none
        default: singbox
      rootfs_mb:
        description: "Root filesystem size in MB (256 / 512 / 1024)"
        type: string
        default: "256"
  push:
    branches: [main]
    paths:
      - "files/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OWRT_VERSION: "25.12.6"
  TARGET_PATH: "mvebu/cortexa53"
  TARGET_NAME: "mvebu-cortexa53"
  PROFILE: "glinet_gl-mv1000"
  PLUGIN: ${{ inputs.plugin || 'singbox' }}
  ROOTFS_MB: ${{ inputs.rootfs_mb || '256' }}
  SINGBOX_VERSION: "1.14.4"
  SINGBOX_HASH: "0958ccd23b1ea9a141d715d15478b1e040fd04bcca19d8ff5529636b1b753e18"
  ARGON_VERSION: "3.1.2"
  ARGON_HASH: "3fdbd812dafd521926891863a372aba78ab83ec24add47bdda910fb1f6b1be40"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses-dev zlib1g-dev \
            libssl-dev rsync unzip file

      # Keyed on the build inputs only, so changes under files/ reuse the
      # previously compiled apk instead of rebuilding it every push.
      - name: Cache built sing-box apk
        if: env.PLUGIN == 'singbox'
        id: singbox-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/singbox-apk
          key: singbox-${{ env.OWRT_VERSION }}-${{ env.SINGBOX_VERSION }}-${{ env.SINGBOX_HASH }}-v1

      - name: Download and verify Image Builder
        run: |
          set -euo pipefail
          IB="openwrt-imagebuilder-${OWRT_VERSION}-${TARGET_NAME}.Linux-x86_64.tar.zst"
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${TARGET_PATH}"
          curl -fsSL -o "$IB" "$BASE/$IB"
          curl -fsSL -o sha256sums "$BASE/sha256sums"
          grep -F "$IB" sha256sums | sha256sum -c -
          tar --zstd -xf "$IB"

      - name: Download and verify OpenWrt SDK
        if: env.PLUGIN == 'singbox' && steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="openwrt-sdk-${OWRT_VERSION}-${TARGET_NAME}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          BASE="https://downloads.openwrt.org/releases/${OWRT_VERSION}/targets/${TARGET_PATH}"
          curl -fsSL -o "$SDK" "$BASE/$SDK"
          curl -fsSL -o sha256sums.sdk "$BASE/sha256sums"
          grep -F "$SDK" sha256sums.sdk | sha256sum -c -
          tar --zstd -xf "$SDK"
          echo "SDK_DIR=$PWD/${SDK%.tar.zst}" >> "$GITHUB_ENV"

      - name: Prepare Image Builder
        run: |
          set -euo pipefail
          cd "openwrt-imagebuilder-${OWRT_VERSION}-${TARGET_NAME}.Linux-x86_64"
          echo "IB_DIR=$PWD" >> "$GITHUB_ENV"
          # Third-party apk packages (argon, locally built sing-box) are not
          # signed with a key known to the build, so signature verification has
          # to be off. Official feeds are still fetched over HTTPS from
          # downloads.openwrt.org.
          sed -i 's/^CONFIG_SIGNATURE_CHECK=.*/# CONFIG_SIGNATURE_CHECK is not set/' .config
          mkdir -p packages
          chmod +x "$GITHUB_WORKSPACE"/files/etc/uci-defaults/*

      - name: Build sing-box-tiny apk
        if: env.PLUGIN == 'singbox' && steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$SDK_DIR"

          # The feed pins 1.13.21; move it to the current upstream release so the
          # binary is built against a patched Go stdlib and upstream fixes.
          ./scripts/feeds update packages
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${SINGBOX_VERSION}/" feeds/packages/net/sing-box/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${SINGBOX_HASH}/" feeds/packages/net/sing-box/Makefile
          grep -E '^PKG_(VERSION|HASH):=' feeds/packages/net/sing-box/Makefile

          # Install the whole feed: golang pulls in golang1.26/host and its
          # bootstrap as host build dependencies.
          ./scripts/feeds install -a -p packages
          echo "CONFIG_PACKAGE_sing-box-tiny=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=n" >> .config
          make defconfig
          grep 'CONFIG_PACKAGE_sing-box' .config
          make package/sing-box/compile BUILD_VARIANT=tiny -j"$(nproc)" V=s

          find bin/packages -name 'sing-box*.apk' -print
          apk=$(find bin/packages -name 'sing-box-tiny-*.apk' | head -n1)
          test -n "$apk"
          mkdir -p "$GITHUB_WORKSPACE/singbox-apk"
          cp "$apk" "$GITHUB_WORKSPACE/singbox-apk/"

      - name: Stage sing-box apk
        if: env.PLUGIN == 'singbox'
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/singbox-apk/sing-box-tiny-*.apk "$IB_DIR/packages/"
          ls -lh "$IB_DIR/packages/"

      - name: Fetch theme and plugin packages
        run: |
          set -euo pipefail
          pkgs="luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-app-package-manager luci-i18n-package-manager-zh-cn curl ca-bundle parted block-mount e2fsprogs wget-ssl"

          argon="luci-theme-argon-${ARGON_VERSION}-r1.apk"
          curl -fsSL -o "$IB_DIR/packages/$argon" \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v${ARGON_VERSION}/$argon"
          echo "$ARGON_HASH  $IB_DIR/packages/$argon" | sha256sum -c -
          pkgs="$pkgs luci-theme-argon"

          case "$PLUGIN" in
            singbox)
              pkgs="$pkgs sing-box-tiny kmod-tun kmod-inet-diag"
              ;;
            openclash)
              oc_url=$(curl -fsSL https://api.github.com/repos/vernesong/OpenClash/releases/latest \
                | jq -r '[.assets[] | select(.name | endswith(".apk")) | .browser_download_url][0]')
              curl -fsSL -o "$IB_DIR/packages/$(basename "$oc_url")" "$oc_url"

              # OpenClash downloads its core on first start; seed it so the
              # router does not need GitHub access to become functional.
              core_url=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
                | jq -r '[.assets[] | select(.name | test("^mihomo-linux-arm64-v.*\\.gz$")) | .browser_download_url][0]')
              mkdir -p "$GITHUB_WORKSPACE/files/etc/openclash/core"
              curl -fsSL "$core_url" | gunzip > "$GITHUB_WORKSPACE/files/etc/openclash/core/clash_meta"
              chmod +x "$GITHUB_WORKSPACE/files/etc/openclash/core/clash_meta"

              pkgs="-dnsmasq dnsmasq-full luci-compat luci-app-openclash $pkgs"
              ;;
            none) ;;
            *) echo "unknown plugin: $PLUGIN"; exit 1 ;;
          esac

          echo "PKGS=$pkgs" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          set -euo pipefail
          cd "$IB_DIR"
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PKGS" \
            FILES="$GITHUB_WORKSPACE/files" \
            ROOTFS_PARTSIZE="$ROOTFS_MB" \
            EXTRA_IMAGE_NAME="mv1000-${PLUGIN}"
          ls -lh bin/targets/"$TARGET_PATH"/

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.OWRT_VERSION }}-mv1000-${{ env.PLUGIN }}
          path: |
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/*ext4-sdcard.img.gz
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/sha256sums
          if-no-files-found: error

      - name: Publish release assets on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            openwrt-imagebuilder-*/bin/targets/mvebu/cortexa53/*ext4-sdcard.img.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
