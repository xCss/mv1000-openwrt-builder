name: Build MV1000 universal firmware (honk default)

# Full OpenWrt source build: the official kernel has neither cgroups nor BTF,
# and honk refuses to start without CONFIG_CGROUP_BPF. honk itself is not
# compiled here; the upstream static aarch64 archive is installed by the
# honk-bin package under honk/honk-bin. The same kernel includes the modules
# needed to install sing-box-tiny later (TUN/auto_redirect or nftables TPROXY).
on:
  push:
    branches: [main]
    paths:
      - "files/**"
      - "honk/**"
      - ".github/workflows/honk.yml"
  workflow_dispatch:
    inputs:
      rootfs_mb:
        description: "Root filesystem size in MB (256 / 512 / 1024)"
        type: string
        default: "256"

permissions:
  contents: write

concurrency:
  group: honk-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  OWRT_VERSION: "25.12.6"
  TARGET_PATH: "mvebu/cortexa53"
  PROFILE: "glinet_gl-mv1000"
  ROOTFS_MB: ${{ inputs.rootfs_mb || '256' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git \
            libncurses-dev libssl-dev libelf-dev libdw-dev zlib1g-dev \
            python3 rsync unzip file wget ccache dwarves

      - name: Clone OpenWrt
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${OWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "src-git vantage https://github.com/anothaDev/luci-theme-vantage.git" \
            >> feeds.conf.default
          ./scripts/feeds update packages luci vantage

      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: honk-build-v2-ubuntu24-${{ runner.arch }}-${{ env.OWRT_VERSION }}-cortexa53-${{ hashFiles('honk/kernel/mvebu-cortexa53.config-6.12', 'honk/honk-bin/Makefile', '.github/workflows/honk.yml') }}
          restore-keys: |
            honk-build-v2-ubuntu24-${{ runner.arch }}-${{ env.OWRT_VERSION }}-cortexa53-

      - name: Install required feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds install -p luci \
            luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn \
            luci-app-package-manager luci-i18n-package-manager-zh-cn \
            ucode-mod-rtnl rpcd-mod-iwinfo rpcd-mod-ucode
          ./scripts/feeds install -p packages \
            curl parted wget-ssl v2ray-geoip v2ray-geosite
          ./scripts/feeds install -p vantage \
            luci-theme-vantage luci-app-vantage \
            luci-i18n-vantage-zh-cn luci-i18n-vantage-theme-zh-cn

      - name: Apply kernel options and local files
        run: |
          set -euo pipefail
          cd openwrt
          cat "$GITHUB_WORKSPACE/honk/kernel/mvebu-cortexa53.config-6.12" \
            >> target/linux/mvebu/cortexa53/config-6.12

          mkdir -p package/honk-bin
          cp -a "$GITHUB_WORKSPACE/honk/honk-bin/." package/honk-bin/
          cp -a "$GITHUB_WORKSPACE/files/." package/base-files/files/
          cat > package/base-files/files/etc/mv1000-build-info <<EOF
          FIRMWARE_FLAVOR=honk-singbox
          OPENWRT_VERSION=${OWRT_VERSION}
          TARGET_PROFILE=${PROFILE}
          SOURCE_COMMIT=${GITHUB_SHA}
          BUILD_RUN_ID=${GITHUB_RUN_ID}
          EOF
          find package/base-files/files/etc/uci-defaults -type f \
            -exec chmod 0755 {} +

          CCACHE_DIR="$PWD/.ccache" ccache -M 2G || true

      - name: Configure
        run: |
          set -euo pipefail
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa53=y
          CONFIG_TARGET_mvebu_cortexa53_DEVICE_glinet_gl-mv1000=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_BUILD_LOG=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_MB}
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          # CONFIG_TARGET_ROOTFS_TARGZ is not set
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_KERNEL_NET_NS=y
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_FTRACE=y
          CONFIG_KERNEL_FUNCTION_TRACER=y
          CONFIG_KERNEL_DYNAMIC_FTRACE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-vantage=y
          CONFIG_PACKAGE_luci-i18n-vantage-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vantage-theme-zh-cn=y
          CONFIG_PACKAGE_ucode-mod-rtnl=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_honk-bin=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-nfnetlink-queue=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          EOF
          make defconfig

          for symbol in CONFIG_TARGET_mvebu_cortexa53_DEVICE_glinet_gl-mv1000 \
              CONFIG_DEVEL CONFIG_CCACHE CONFIG_BUILD_LOG CONFIG_TARGET_ROOTFS_EXT4FS \
              CONFIG_LUCI_LANG_zh_Hans \
              CONFIG_PACKAGE_luci-i18n-base-zh-cn \
              CONFIG_PACKAGE_luci-i18n-firewall-zh-cn \
              CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn \
              CONFIG_PACKAGE_luci-i18n-vantage-zh-cn \
              CONFIG_PACKAGE_luci-i18n-vantage-theme-zh-cn \
              CONFIG_PACKAGE_honk-bin CONFIG_PACKAGE_luci-theme-vantage \
              CONFIG_PACKAGE_luci-app-vantage CONFIG_PACKAGE_kmod-sched-bpf \
              CONFIG_PACKAGE_kmod-tun CONFIG_PACKAGE_kmod-inet-diag \
              CONFIG_PACKAGE_kmod-nft-nat CONFIG_PACKAGE_kmod-nft-fib \
              CONFIG_PACKAGE_kmod-nft-tproxy CONFIG_PACKAGE_kmod-nf-tproxy \
              CONFIG_PACKAGE_kmod-nft-socket CONFIG_PACKAGE_kmod-nf-socket \
              CONFIG_KERNEL_CGROUPS CONFIG_KERNEL_CGROUP_BPF \
              CONFIG_KERNEL_NAMESPACES CONFIG_KERNEL_NET_NS \
              CONFIG_KERNEL_DEBUG_INFO CONFIG_KERNEL_DEBUG_INFO_BTF \
              CONFIG_KERNEL_FTRACE CONFIG_KERNEL_FUNCTION_TRACER \
              CONFIG_KERNEL_DYNAMIC_FTRACE CONFIG_DWARVES; do
            grep -qx "${symbol}=y" .config || {
              echo "::error::${symbol} was not selected"
              exit 1
            }
          done
          grep -qx "CONFIG_TARGET_PROFILE=\"DEVICE_${PROFILE}\"" .config || {
            echo "::error::the selected target profile is not ${PROFILE}"
            grep '^CONFIG_TARGET_PROFILE=' .config || true
            exit 1
          }
          for symbol in CONFIG_TARGET_ROOTFS_INITRAMFS CONFIG_TARGET_ROOTFS_SQUASHFS \
              CONFIG_TARGET_ROOTFS_TARGZ; do
            grep -qx "# ${symbol} is not set" .config || {
              echo "::error::unexpected extra image format: ${symbol}"
              exit 1
            }
          done
          grep -qx '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config || {
            echo "::error::reduced debug information is incompatible with BTF"
            exit 1
          }

      - name: Prepare host tools and toolchain
        id: toolchain
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" tools/install toolchain/install 2>&1 \
            | tee "$RUNNER_TEMP/honk-toolchain.log"

      - name: Save host tools and toolchain
        if: steps.toolchain.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Build
        id: compile
        run: |
          set -euo pipefail
          cd openwrt
          # The default target is world: download, compile and assemble images.
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/honk-build.log"

          mapfile -t images < <(find bin/targets/"$TARGET_PATH" -maxdepth 1 \
            -type f -name "*-${PROFILE}-ext4-sdcard.img.gz")
          test "${#images[@]}" -eq 1 || {
            echo "::error::expected exactly one MV1000 ext4 sdcard image"
            ls -lhR bin/targets/"$TARGET_PATH"/ || true
            exit 1
          }
          CCACHE_DIR="$PWD/.ccache" ccache -s || true

      - name: Verify kernel and image contents
        run: |
          set -euo pipefail
          cd openwrt
          mapfile -t kconfs < <(find build_dir -type f \
            -path '*/linux-mvebu_cortexa53/linux-[0-9]*/.config')
          test "${#kconfs[@]}" -eq 1 || {
            echo "::error::expected exactly one MV1000 kernel configuration"
            printf '%s\n' "${kconfs[@]}"
            exit 1
          }
          kconf="${kconfs[0]}"
          for symbol in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT \
              CONFIG_CGROUPS CONFIG_CGROUP_BPF CONFIG_NET_SCHED CONFIG_NET_CLS_ACT \
              CONFIG_NET_XGRESS CONFIG_NAMESPACES CONFIG_NET_NS \
              CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF CONFIG_FTRACE \
              CONFIG_FUNCTION_TRACER CONFIG_DYNAMIC_FTRACE; do
            grep -qx "${symbol}=y" "$kconf" || {
              echo "::error::${symbol} is not =y in the built kernel"
              exit 1
            }
          done
          for symbol in CONFIG_NF_TABLES CONFIG_NF_TABLES_INET CONFIG_NFT_CT \
              CONFIG_NFT_QUEUE CONFIG_NETFILTER_NETLINK_QUEUE \
              CONFIG_TUN CONFIG_INET_DIAG CONFIG_INET_TCP_DIAG \
              CONFIG_INET_UDP_DIAG CONFIG_INET_RAW_DIAG \
              CONFIG_NFT_NAT CONFIG_NFT_FIB_INET \
              CONFIG_NFT_TPROXY CONFIG_NF_TPROXY_IPV4 CONFIG_NF_TPROXY_IPV6 \
              CONFIG_NFT_SOCKET CONFIG_NF_SOCKET_IPV4 CONFIG_NF_SOCKET_IPV6; do
            grep -Eq "^${symbol}=[ym]$" "$kconf" || {
              echo "::error::${symbol} is neither =y nor =m in the built kernel"
              exit 1
            }
          done
          mapfile -t roots < <(find build_dir -type d -path '*/root-mvebu')
          test "${#roots[@]}" -eq 1
          root="${roots[0]}"
          grep -qx 'FIRMWARE_FLAVOR=honk-singbox' "$root/etc/mv1000-build-info"
          grep -qx "SOURCE_COMMIT=${GITHUB_SHA}" "$root/etc/mv1000-build-info"
          for package in kmod-tun kmod-inet-diag kmod-nft-nat kmod-nft-fib \
              kmod-nft-tproxy kmod-nf-tproxy kmod-nft-socket kmod-nf-socket; do
            test -s "$root/lib/apk/packages/${package}.list" || {
              echo "::error::${package} is not installed in the image"
              exit 1
            }
          done
          for module in tun inet_diag tcp_diag udp_diag raw_diag nft_tproxy \
              nf_tproxy_ipv4 nf_tproxy_ipv6 nft_socket nf_socket_ipv4 nf_socket_ipv6; do
            test -n "$(find "$root/lib/modules" -type f -name "${module}.ko*" -print -quit)" || {
              echo "::error::missing installed kernel module: ${module}"
              exit 1
            }
          done
          test -s "$root/etc/modules.d/30-tun" || {
            echo "::error::TUN module has no boot autoload entry"
            exit 1
          }
          vmlinux="$(dirname "$kconf")/vmlinux"
          readelf -SW "$vmlinux" > "$RUNNER_TEMP/honk-vmlinux-sections.txt"
          grep -Eq '[[:space:]]\.BTF[[:space:]]' "$RUNNER_TEMP/honk-vmlinux-sections.txt" || {
            echo "::error::built vmlinux has no .BTF section"
            exit 1
          }
          test -x "$(find build_dir -type f -name honk-core -print -quit)"
          test -d "$(find build_dir -type d -path '*/root-*/www/luci-static/vantage' -print -quit)"
          for catalog in base firewall package-manager vantage vantage-theme; do
            test -s "$(find build_dir -type f \
              -path "*/root-mvebu/usr/lib/lua/luci/i18n/${catalog}.zh-cn.lmo" -print -quit)" || {
              echo "::error::missing Simplified Chinese translation: ${catalog}"
              exit 1
            }
          done
          ls -lh bin/targets/mvebu/cortexa53/

      - name: Collect image and matching kernel packages
        run: |
          set -euo pipefail
          cd openwrt
          out="$RUNNER_TEMP/mv1000-kernel-packages"
          mkdir -p "$out"
          # Keep the kernel ABI marker and every built kmod from this run.
          # These packages must never be mixed with official-kernel kmods.
          mapfile -t packages < <(find "bin/targets/$TARGET_PATH/packages" -maxdepth 1 \
            -type f \( -name 'kernel-*.apk' -o -name 'kmod-*.apk' \))
          test "${#packages[@]}" -gt 0
          cp "${packages[@]}" "$out/"
          for package in kernel kmod-tun kmod-inet-diag kmod-nft-nat kmod-nft-fib \
              kmod-nft-tproxy kmod-nf-tproxy kmod-nft-socket kmod-nf-socket; do
            matches=("$out/${package}-"[0-9]*.apk)
            test "${#matches[@]}" -eq 1 && test -s "${matches[0]}" || {
              echo "::error::missing or ambiguous kernel package: ${package}"
              exit 1
            }
          done
          cp package/base-files/files/etc/mv1000-build-info "$out/"
          mapfile -t vermagics < <(find build_dir -type f \
            -path '*/linux-mvebu_cortexa53/linux-[0-9]*/.vermagic')
          test "${#vermagics[@]}" -eq 1
          test -s "${vermagics[0]}"
          cp "${vermagics[0]}" "$out/kernel.vermagic"
          ( cd "$out" && sha256sum ./*.apk mv1000-build-info kernel.vermagic > sha256sums )

          # Stage the image in one directory to keep artifact paths flat.
          image_out="$RUNNER_TEMP/mv1000-image"
          mkdir -p "$image_out"
          mapfile -t images < <(find "bin/targets/$TARGET_PATH" -maxdepth 1 \
            -type f -name "*-${PROFILE}-ext4-sdcard.img.gz")
          mapfile -t manifests < <(find "bin/targets/$TARGET_PATH" -maxdepth 1 \
            -type f -name "*-${PROFILE}.manifest")
          test "${#images[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          cp "${images[0]}" "${manifests[0]}" "bin/targets/$TARGET_PATH/sha256sums" "$image_out/"
          cp package/base-files/files/etc/mv1000-build-info "$image_out/"

      - name: Report build failure
        if: failure()
        run: |
          df -h /
          free -h
          find openwrt/logs/target/linux -type f -name '*.txt' -print \
            -exec tail -n 100 {} \; 2>/dev/null || true

      - name: Upload build configuration
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: honk-build-config-${{ github.run_id }}
          path: |
            openwrt/.config
            openwrt/build_dir/target-*/linux-mvebu_cortexa53/linux-*/.config
            openwrt/logs/target/linux/
            ${{ runner.temp }}/honk-vmlinux-sections.txt
            ${{ runner.temp }}/honk-toolchain.log
            ${{ runner.temp }}/honk-build.log
            openwrt/package/base-files/files/etc/mv1000-build-info
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ env.OWRT_VERSION }}-mv1000-honk
          path: ${{ runner.temp }}/mv1000-image/
          if-no-files-found: error

      - name: Upload matching kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: mv1000-kernel-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/mv1000-kernel-packages/
          if-no-files-found: error

      - name: Publish release assets on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            openwrt/bin/targets/mvebu/cortexa53/*glinet_gl-mv1000-ext4-sdcard.img.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
